name: Server Keep Alive

on:
  schedule:
    # 10분마다 실행 (Render 15분 Sleep 방지)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 수동 실행 지원

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Mongly Server Health Endpoint
        run: |
          SERVER_URL="${{ secrets.RENDER_SERVER_URL || 'https://mongly-server.onrender.com' }}"
          echo "Pinging $SERVER_URL/api/health"
          curl -s -f "$SERVER_URL/api/health" || curl -s -f "$SERVER_URL/health" || true
